name: Build DMG

# Pushing a tag like v0.1.0 builds Toolbox-0.1.0.dmg and publishes it as a GitHub release.
# Running the workflow by hand builds the DMG with project.yml's version and attaches it to the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version=""; fi
          scripts/build-dmg.sh "$version"

      - uses: actions/upload-artifact@v7
        with:
          name: Toolbox-dmg
          path: build/Toolbox-*.dmg
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Toolbox-*.dmg \
            --title "Toolbox ${GITHUB_REF_NAME#v}" \
            --notes "Open the DMG and drag Toolbox to Applications. Requires macOS 26 or later.

          This build isn't notarized by Apple yet, so macOS blocks it the first time. After trying to open it, go to System Settings › Privacy & Security and click **Open Anyway**."
