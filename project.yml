name: Toolbox
options:
  bundleIdPrefix: com.fiaxe
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Toolbox:
    type: application
    platform: macOS
    sources:
      - path: Toolbox
    info:
      path: Toolbox/Resources/Info.plist
      properties:
        CFBundleDisplayName: Toolbox
        CFBundleName: Toolbox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 Fiaxe. All rights reserved."
        NSCameraUsageDescription: Toolbox uses the camera to add a webcam overlay to screen recordings.
        NSMicrophoneUsageDescription: Toolbox uses the microphone to record audio, narrate screen recordings, and transcribe dictation.
        NSSpeechRecognitionUsageDescription: Toolbox transcribes audio on your Mac. Nothing is uploaded.
        NSScreenCaptureUsageDescription: Toolbox records your screen when you start a screen recording.
        NSAppleEventsUsageDescription: Toolbox reads Finder selections and uses Apple Pages locally to convert Pages documents.
        NSDesktopFolderUsageDescription: Toolbox opens the files you pick on your Desktop and saves the results next to them.
        NSDocumentsFolderUsageDescription: Toolbox opens the files you pick in Documents and saves the results next to them.
        NSDownloadsFolderUsageDescription: Toolbox opens the files you pick in Downloads, and saves recordings and results there.
        NSLocalNetworkUsageDescription: Share on Wi-Fi and Whiteboard let phones and computers on your network open a private link to this Mac. Nothing goes through the internet.
    entitlements:
      path: Toolbox/Resources/Toolbox.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiaxe.toolbox
        PRODUCT_NAME: Toolbox
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 38DQ2F7Q9D
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
  ToolboxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Toolbox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fiaxe.toolbox.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Toolbox.app/Contents/MacOS/Toolbox"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Toolbox:
    build:
      targets:
        Toolbox: all
    test:
      targets:
        - ToolboxTests
